meta:
  title: "Nathan's Homelab"
  title_redacted: "Nathan's Homelab"
  date: "November 2026"
  watermark: "u/nathanworms"
  domain: "homelab.yarg.ca"

redact:
  domain: true
  domain_placeholder: "redacted.com"
  ssid_names: false

vlans:
  - {key: "1", tag: "VLAN 1", name: Mgmt, subnet: "10.0.1.0/24", color: "#e3b341", note: "management · hypervisor, UniFi, VPN clients"}
  - {key: "20", tag: "VLAN 20", name: Work, subnet: "10.0.20.0/24", color: "#3fb950", note: "workstations · wireless clients"}
  - {key: "30", tag: "VLAN 30", name: IoT, subnet: "10.0.30.0/24", color: "#bc8cff", note: "internet only · Home Assistant integration"}
  - {key: "40", tag: "VLAN 40", name: K8s-Talos, subnet: "10.0.40.0/24", color: "#f0883e", note: "Talos nodes · Cilium BGP to VyOS"}
  - {key: "50", tag: "VLAN 50", name: Home, subnet: "10.0.50.0/24", color: "#58a6ff", note: "trusted personal devices"}
  - {key: "60", tag: "VLAN 60", name: Bambu, subnet: "10.0.60.0/24", color: "#f778ba", note: "3D printer · MQTT + FTPS"}
  - {key: "vpn", tag: "WireGuard", name: VPN, subnet: "10.0.99.0/24", color: "#00bcd4", note: "split tunnel · LAN-like access"}
  - {key: "wan", tag: "WAN", name: WAN, subnet: "ISP DHCP", color: "#f85149", note: "untrusted · PCIe passthrough to VyOS"}

internet:
  speed: {down: "1 Gbit/s", up: "1 Gbit/s"}
  cloud_services:
    - {icon: cloudflare, name: "Cloudflare", note: "DNS · DDNS for n.{domain}"}
    - {icon: backblaze, name: "Google Cloud Storage", note: "offsite backup target"}

fritzbox:
  stub: true
  name: "ISP modem"
  type: "bridge"
  model: "ISP modem · bridge mode"

opnsense:
  name: "VyOS"
  type: "router/firewall"
  model: "edge-firewall · VM on node-1"
  os: "VyOS 1.5"
  hw:
    - {icon: glyph-cpu, label: "CPU", value: "4 vCPU", sub: "allocated from node-1"}
    - {icon: glyph-ram, label: "MEMORY", value: "8 GB", sub: "allocated from node-1"}
    - {icon: glyph-nic, label: "NETWORK", value: "ens4f1", sub: "2.5G trunk · native VLAN 1"}
    - {icon: glyph-nic, label: "NETWORK", value: "0000:03:00.0", sub: "2.5G WAN · PCIe passthrough"}
  ip: "10.0.1.1"
  internal: edge-firewall
  wan_ip: "WAN DHCP"
  services:
    - {icon: wireguard, name: "WireGuard", note: "wg0 · UDP 51820"}
    - {icon: adguard, name: "DNS forwarder", note: "→ 10.0.41.53"}
    - {icon: glyph-dhcp, name: "DHCP server", note: "10.0.1.100-200"}
    - {icon: glyph-shield, name: "Zone firewall", note: "Homelab / Alpha / Prod"}
    - {icon: glyph-block, name: "BGP filters", note: "AS 65001 ↔ 65002"}

switch:
  name: "UniFi Switch"
  type: "switch"
  model: "UniFi Switch · 10.0.1.2"
  ip: "10.0.1.2"
  internal: unifi-switch
  os: "UniFi Network"
  config: "L2 trunk · native VLAN 1, tagged 20/30/40/50/60"
  ports:
    - {name: ether1, to: "VyOS", untagged: "1", tagged: ["20","30","40","50","60"]}
    - {name: ether2, to: "free"}
    - {name: ether3, to: "Desk PC", untagged: "50"}
    - {name: ether5, to: "Doorbell", untagged: "1"}
    - {name: ether6, to: "UniFi AP", untagged: "1", tagged: ["20","30","50","60"]}
    - {name: ether7, to: "Bambu", untagged: "60"}
    - {name: sfpp1, to: "free"}
    - {name: sfpp2, to: "node-1", untagged: "1", tagged: ["20","30","40","50","60"]}

devices:
  madcat:
    name: "Desk PC"
    type: "workstation"
    model: "personal desktop"
    os: "Windows 11"
    icons: [windows]
    vlan: "50"
    ip: "10.0.50.50"
    internal: desk-pc
  jetkvm:
    name: "Doorbell"
    type: "camera"
    model: "Reolink video doorbell"
    icons: [glyph-antenna]
    vlan: "1"
    ip: "10.0.1.105"
    internal: doorbell
  ap:
    name: "UniFi AP"
    type: "access point"
    model: "UniFi U7 Lite · Wi-Fi 7"
    icons: [unifi]
    vlan: "1"
    trunk: true
    ip: "10.0.1.3"
    internal: unifi-ap
  slzb:
    name: "Bambu Printer"
    type: "3D printer"
    model: "Bambu Lab A1 mini"
    icons: [glyph-cpu]
    vlan: "60"
    ip: "10.0.60.100"
    internal: bambu-printer

ssids:
  - {name: "Home", redacted: "Home", vlan: "50"}
  - {name: "Work", redacted: "Work", vlan: "20"}
  - {name: "IoT", redacted: "IoT", vlan: "30"}
  - {name: "Bambu", redacted: "Bambu", vlan: "60"}

remote:
  name: "WireGuard VPN"
  note: "laptop + phone · UDP 51820 → 10.0.99.1"

port_forwards:
  - {port: "80, 443", proto: "TCP", to: "Gateway API", what: "*.homelab.yarg.ca → Cilium VIPs"}
  - {port: "51820", proto: "UDP", to: "WireGuard", what: "remote access VPN"}

terra:
  name: "node-1"
  type: "hypervisor"
  model: "Lenovo ThinkStation P320"
  os: "Incus OS · ZFS"
  ip: "10.0.1.254"
  internal: node-1
  hw:
    - {icon: glyph-cpu, label: "CPU", value: "i7-7700K", sub: "4 cores · 8 threads"}
    - {icon: glyph-ram, label: "MEMORY", value: "32 GB DDR4", sub: "Incus local ZFS pool"}
    - {icon: glyph-ssd, label: "SSD", value: "Samsung SM961 512 GB", sub: "NVMe · host + local pool"}
    - {icon: glyph-nic, label: "NETWORK", value: "eno1", sub: "1G management"}
    - {icon: glyph-nic, label: "NETWORK", value: "ens4f1", sub: "2.5G VLAN trunk"}
    - {icon: glyph-nic, label: "NETWORK", value: "0000:03:00.0", sub: "2.5G WAN passthrough"}
    - {icon: glyph-gpu, label: "GPU", value: "passthrough capable", sub: "→ talos-cp-01"}
    - {icon: glyph-hdd, label: "HDD", value: "Toshiba X300 4 TB", sub: "passthrough → talos-cp-01"}
    - {icon: glyph-hdd, label: "HDD", value: "Toshiba X300 4 TB", sub: "passthrough → talos-cp-01"}
  dmz_groups:
    - name: "Core services"
      guests:
        - {id: 101, kind: VM, ip: ".40.10", name: "talos-cp-01", icons: [glyph-cpu], note: "Talos · 24 GiB · GPU + 2×4 TB", internal: talos-cp-01}
        - {id: 102, name: "Immich", icons: [immich], note: "photo library", host: immich, exposure: public}
        - {id: 103, name: "Home Assistant", icons: [homeassistant], note: "automation hub", host: ha, exposure: local}
    - name: "Observability"
      guests:
        - {id: 110, name: "Grafana", icons: [grafana], note: "dashboards", host: grafana, exposure: public}
        - {id: 111, name: "Prometheus", icons: [prometheus], note: "node + cluster metrics", internal: prometheus}
        - {id: 112, name: "Loki", icons: [loki], note: "logs via Alloy", internal: loki}
    - name: "Media & docs"
      guests:
        - {id: 120, name: "Paperless-ngx", icons: [paperless], note: "documents", host: paperless, exposure: public}
        - {id: 121, name: "Stirling PDF", icons: [stirling], note: "PDF tools", host: pdf, exposure: public}
        - {id: 122, name: "Argo CD", icons: [docker], note: "GitOps", internal: argocd}
    - name: "Finance & automation"
      guests:
        - {id: 130, name: "Firefly III", icons: [glyph-shield], note: "finances", host: firefly, exposure: public}
        - {id: 131, name: "ntfy", icons: [glyph-antenna], note: "notifications", host: ntfy, exposure: local}
    - name: "Platform"
      guests:
        - id: 140
          name: "ORY stack"
          icons: [glyph-shield]
          note: "auth · Hydra + Kratos"
          docker: true
          apps:
            - {icon: glyph-shield, name: "Hydra", host: hydra}
            - {icon: glyph-shield, name: "Kratos", host: kratos}
            - {icon: glyph-shield, name: "Oathkeeper", note: "identity-aware proxy"}
        - {id: 141, name: "SeaweedFS", icons: [glyph-hdd], note: "S3 object store", internal: seaweedfs}
        - {id: 142, name: "CNPG", icons: [glyph-ssd], note: "Postgres cluster", internal: cnpg}
  media_pipeline:
    nodes:
      dns: {icon: adguard, name: "AdGuard Home", role: "DNS", ip: "10.0.41.53", sub: "sinkhole", url: "dns → BIND9"}
      extdns: {icon: glyph-dhcp, name: "External-DNS", role: "GitOps", ip: "10.0.41.10", sub: "HTTPRoutes", url: "RFC 2136 · TSIG"}
      bind: {icon: glyph-dhcp, name: "BIND9", role: "ZONE", ip: "10.107.224.92", sub: "authoritative", url: "homelab.yarg.ca"}
      bgp: {icon: glyph-nic, name: "Cilium BGP", role: "AS 65002", ip: "10.0.40.10", sub: "advertises /32", url: "peer: VyOS AS 65001"}
    gateways:
      - {icon: glyph-shield, name: "homelab-gateway", ip: "10.0.41.10", url: "*.homelab.yarg.ca"}
      - {icon: glyph-shield, name: "athletics Prod", ip: "10.0.41.11", url: "prod gateway"}
      - {icon: glyph-shield, name: "athletics Alpha", ip: "10.0.41.12", url: "alpha · local only"}
    zones:
      homelab: {name: "homelab.yarg.ca", pool: "public + VPN records", note: "External-DNS sync"}
      alpha: {name: "alpha apps (local)", pool: "internal only", note: "no public records"}
  other_guests:
    truenas:
      id: 150
      kind: VM
      vlan: "40"
      ip: "10.0.40.10"
      internal: talos-cp-01
      name: "SeaweedFS + CNPG"
      icons: [glyph-hdd]
      note: "VM 150 · storage on 2×4 TB HDD"
      pools:
        - name: "NVMe tier"
          layout: "512 GB NVMe"
          used: "S3 objects"
          pct: 25
          groups:
            - {kind: nvme, count: 1, label: "SeaweedFS", sub: "S3 API", sub2: "object storage"}
        - name: "CNPG data"
          layout: "2× 4 TB HDD"
          used: "Postgres primary"
          pct: 40
          groups:
            - {kind: hdd, count: 2, label: "CNPG cluster", sub: "passthrough → Talos", sub2: "high availability"}
      footer: "GCS offsite backups · SOPS-encrypted secrets"
    haos:
      {id: 151, kind: VM, vlan: "30", ip: "10.0.30.10", host: ha, name: "Home Assistant OS", icons: [homeassistant], note: "VM 151 · automation hub",
       addons: [zigbee2mqtt, mosquitto, thread-l, matter-l, esphome], addons_text: "Z2M · MQTT · OTBR · Matter · ESPHome"}
    unifi: {id: 152, kind: CT, vlan: "1", ip: "10.0.1.9", internal: unifi, name: "UniFi Controller", icons: [unifi], note: "CT 152 · switches + AP"}
    bliss: {id: 153, kind: CT, vlan: "40", ip: "10.0.41.53", internal: adguard, name: "AdGuard Home", icons: [adguard], note: "CT 153 · DNS sinkhole"}
